plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.hoangnt.aichatbot"
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.hoangnt.aichatbot"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    def releaseKeystore = file(System.getenv("RELEASE_KEYSTORE") ?: "test-release.keystore")
    def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: "android"
    def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: "aichatbot"
    def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: "android"

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter { source "../.." }

// JVM 17 compatibility fix
